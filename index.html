<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruzadinha de Arquitetura Computacional</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Cruzadinha de Arquitetura Computacional</h1>
  <p class="sub">Leia as dicas, clique em uma delas e digite a resposta na grade. Sem acento e sem espaço.</p>
  <div class="stat"><div class="bar"><div id="fill"></div></div><span id="prog">0 de 16</span><button class="btn" id="reset">Recomeçar</button></div>
</header>
<main>
  <section class="gridwrap"><div id="grid"></div></section>
  <aside><ol id="clues"></ol></aside>
</main>
<div id="modal" hidden><div class="box"><div class="big">🎉</div><h2>Parabéns!</h2><p>Você completou a cruzadinha e acertou todos os 16 termos. Agora você conhece o essencial de como um computador funciona por dentro.</p><button class="btn" id="close">Fechar</button></div></div>
<script src="Script.js"></script>
</body>
</html>
